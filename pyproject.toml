[project]
name = "white-keeper"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nakata", email = "u066928d@ecs.oaka-u.ac.jp" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.1",
    "streamlit>=1.39.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
white-keeper = "white_keeper:main"

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
